 <!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>fruits quality and adulteration classifier</title>

    <link rel="stylesheet"
          href="/static/style.css">

</head>


<body>

    <div class="container">

        <div class="card">

            <h1>🍋 Fruits Quality And Adulteration Classifier</h1>

            <p class="subtitle">
                Upload a fruit image to detect its quality and adulteration.
            </p>


            <div class="upload-box">

                <input
                    type="file"
                    id="imageInput"
                    accept="image/*"
                >

                <label for="imageInput">

                    <div class="upload-icon">
                        +
                    </div>

                    <p>
                        Click to upload image
                    </p>

                    <span>
                        PNG, JPG, JPEG
                    </span>

                </label>

            </div>

            <div id="previewContainer"
                 class="preview-container hidden">

                <h3>Selected fruit image</h3>

                <img
                    id="preview"
                    src=""
                    alt="MRI Preview"
                >

            </div>

            <button
                id="predictBtn"
                disabled
            >
                Predict
            </button>

            <div id="loading"
                 class="hidden">

                <div class="loader"></div>

                <p>
                    Analyzing Image...
                </p>

            </div>

            <div id="result"
                 class="result hidden">

                <h2>Predicted Quality</h2>

                <div class="prediction">

                    <span>Class:</span>

                    <strong id="prediction">
                        -
                    </strong>

                </div>


                <div class="prediction">

                    <span>Confidence:</span>

                    <strong id="confidence">
                        -
                    </strong>

                </div>

            </div>

        </div>

    </div>


    <script src="/static/script.js"></script>

</body>

</html>
